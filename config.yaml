# wxbot-mini 配置文件
# 修改后重启程序生效。

# ── 大模型 ──────────────────────────────────────────────
llm:
  # api  : 直调 OpenAI 兼容接口（默认，延迟低）
  # dsh  : 走 `dsh headless`，可使用 DSH 的 skill/工具能力
  engine: api

  api:
    base_url: http://172.16.1.147:4000/v1
    model: wx_40b
    # key 从环境变量读取，避免写死在文件里
    api_key_env: WX40B_API_KEY
    timeout_seconds: 120

  dsh:
    command: dsh
    args: ["headless"]

# ── 节流 ────────────────────────────────────────────────
rate:
  # 轮询间隔（秒）：两次扫描未读会话之间的等待
  poll_seconds: 3
  # 同一会话多条连续消息的合并窗口（秒）：窗口内的消息合并为一次提问
  merge_window_seconds: 4
  # 每次发送前的随机间隔区间（秒），降低风控风险
  send_interval: [1.5, 3.5]

# ── 功能开关 ────────────────────────────────────────────
features:
  # 消息里带 http(s) 链接时，抓取网页正文拼进提问
  read_links: true
  # 每次提问附带当前时间（年-月-日 星期 时:分）
  time_context: true
  # 表情包：FAE 技术支持场景默认关闭
  emotions: false
  emotion_mode: hybrid

# ── 知识库（FAE 技术支持核心）────────────────────────────
# 往 knowledge/ 放 md/txt，按标题切段，提问时关键词命中 top_k 段注入上下文。
# 改文件即生效，无需重启。
knowledge:
  enabled: true
  dir: knowledge
  top_k: 3

# ── 会话记忆 ────────────────────────────────────────────
memory:
  enabled: true
  dir: memory          # 相对项目根目录；每个会话一个 md 文件
  # 每个会话在上下文里保留的最近消息条数
  max_history: 8
  # 达到该条数后自动把旧消息摘要进记忆文件
  summarize_after: 24

# ── Prompt 路由 ─────────────────────────────────────────
# 键 = 微信昵称或群名，值 = 该会话专属 system prompt。
# 命中不了的会话走 default。
prompts:
  default: |
    你是 FAE（现场应用工程师）技术支持助手。基于给定知识库内容回答工程师/客户咨询：
    简洁直接，给可执行结论（型号、寄存器、参数、命令、接线），必要时分点。
    知识库未覆盖的内容如实说明，不要编造。不需要表情标签，直接输出回复文本。

routes:
  # 示例：
  # 工作群: |
  #   你是项目组内助手，回答偏工程，给出可直接执行的命令。

# ── 监听范围 ────────────────────────────────────────────
# 留空 listen = 回复所有会话；否则只回复列出的昵称/群名。
# 测试期只放开自己：文件传输助手 + 模拟客户的小号「叶子」。
listen: ["文件传输助手", "叶子"]
