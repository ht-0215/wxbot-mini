# wxbot-mini 配置文件
# 修改后重启程序生效。

# ── 大模型 ──────────────────────────────────────────────
llm:
  # api  : 直调 OpenAI 兼容接口（默认，延迟低）
  # dsh  : 走 `dsh headless`，可使用 DSH 的 skill/工具能力
  engine: api

  api:
    base_url: http://172.16.1.147:4000/v1
    model: wx_40b
    # key 从环境变量读取，避免写死在文件里
    api_key_env: WX40B_API_KEY
    timeout_seconds: 120
    max_tokens: 700        # 答复长度封顶，控制尾延；调大可更详尽但更慢

  dsh:
    command: dsh
    args: ["headless"]

# ── 节流 ────────────────────────────────────────────────
rate:
  # 轮询间隔（秒）：两次扫描未读会话之间的等待
  poll_seconds: 3
  # 同一会话多条连续消息的合并窗口（秒）：窗口内的消息合并为一次提问
  merge_window_seconds: 4
  # 每次发送前的随机间隔区间（秒），降低风控风险
  send_interval: [1.5, 3.5]

# ── 功能开关 ────────────────────────────────────────────
features:
  # 消息里带 http(s) 链接时，抓取网页正文拼进提问
  read_links: true
  # 每次提问附带当前时间（年-月-日 星期 时:分）
  time_context: true
  # 表情包：默认关闭；主链路为 DB-only 纯文本（面板等前台方案已弃用）
  emotions: false
  emotion_mode: hybrid

# ── 知识库（FAE 技术支持核心）────────────────────────────
# 往 knowledge/ 放 md/txt/tex，按标题切段，提问时关键词命中 top_k 段注入上下文。
# 改文件即生效，无需重启。extra_dirs 可指定任意多个根（支持 WSL UNC 路径）。
knowledge:
  enabled: true
  dir: knowledge
  extra_dirs:
    - '\\wsl.localhost\Ubuntu-22.04\home\wx\ramfs'   # 单引号：保留双反斜杠 UNC 前缀
  # 源码根：只挂关心的子目录（c/h/dts 参与检索），整棵树太大
  code_dirs:
    - '\\wsl.localhost\Ubuntu-22.04\opt\kernel\linux-4.9.56-2023-6-2\linux-4.9.56\arch\csky'
    - '\\wsl.localhost\Ubuntu-22.04\opt\kernel\linux-4.9.56-2023-6-2\linux-4.9.56\arch-csky-drivers'
    - '\\wsl.localhost\Ubuntu-22.04\opt\kernel\linux-4.9.56-2023-6-2\linux-4.9.56\drivers\net\phy'
    - '\\wsl.localhost\Ubuntu-22.04\home\wx\dev\wx-sdk\kyland_api-V1.0.6'
    - '\\wsl.localhost\Ubuntu-22.04\home\wx\dev\wx-sdk\phy'
  top_k: 5

# ── 会话记忆 ────────────────────────────────────────────
memory:
  enabled: true
  dir: memory          # 相对项目根目录；每个会话一个 md 文件
  # 每个会话在上下文里保留的最近消息条数
  max_history: 8
  # 达到该条数后自动把旧消息摘要进记忆文件
  summarize_after: 24

# ── Prompt 路由 ─────────────────────────────────────────
# 键 = 微信昵称或群名，值 = 该会话专属 system prompt。
# 命中不了的会话走 default。
prompts:
  default: |
    你是 FAE（现场应用工程师）技术支持助手。基于给定知识库内容回答工程师/客户咨询：
    简洁直接，给可执行结论（型号、寄存器、参数、命令、接线），必要时分点。
    知识库未覆盖的内容如实说明，不要编造。不需要表情标签，直接输出回复文本。

routes:
  bot测试群: |
    你是KD系列交换芯片的FAE，在服务客户的项目群里。只依据知识库参考段落作答：
    有具体命令/参数就引用给结论，概述性内容不算依据；未覆盖的如实说明并指出章节名。
    分点简洁，直接输出回复文本。

# ── 监听范围 ────────────────────────────────────────────
# 留空 listen = 回复所有会话；否则只回复列出的昵称/群名。
listen: ["文件传输助手", "叶子", "bot测试群"]
# 群聊只回 @本人 的消息（文本含下列任一名字）；单聊不受影响。
# 设为 [] 表示群内所有消息都回。
at_names: ["H", "huangtao"]

# ── 企业微信智能机器人回调（python run.py --serve）───────
# 管理后台「智能机器人 → API 模式」填：http://<本机IP>:8090/
# Token 与后台一致；留空则跳过签名校验（内网调试方便）。
wecom:
  host: 0.0.0.0
  port: 8090
  token: ""

# ── 窗口绑定（双开微信时固定 bot 用哪个窗口）────────────
# 优先级 hwnd > title；都为 0/空则跟随系统默认。
# python run.py --wins 可列出当前所有微信窗口的 hwnd 与位置。
window:
  hwnd: 0
  title: ""
