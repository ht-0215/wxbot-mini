# wxbot-mini 配置文件
# 修改后重启程序生效。

# ── 大模型 ──────────────────────────────────────────────
llm:
  # api  : 直调 OpenAI 兼容接口（默认，延迟低）
  # dsh  : 走 `dsh headless`，可使用 DSH 的 skill/工具能力
  engine: api

  api:
    base_url: http://172.16.1.147:4000/v1
    model: wx_40b
    # key 从环境变量读取，避免写死在文件里
    api_key_env: WX40B_API_KEY
    timeout_seconds: 120

  dsh:
    command: dsh
    args: ["headless"]

# ── 节流 ────────────────────────────────────────────────
rate:
  # 轮询间隔（秒）：两次扫描未读会话之间的等待
  poll_seconds: 3
  # 同一会话多条连续消息的合并窗口（秒）：窗口内的消息合并为一次提问
  merge_window_seconds: 4
  # 每次发送前的随机间隔区间（秒），降低风控风险
  send_interval: [1.5, 3.5]

# ── 功能开关 ────────────────────────────────────────────
features:
  # 消息里带 http(s) 链接时，抓取网页正文拼进提问
  read_links: true
  # 每次提问附带当前时间（年-月-日 星期 时:分）
  time_context: true
  # 回复末尾允许模型打情绪标签 [happy]/[加油]，自动配一个表情
  emotions: true
  # 表情策略：
  #   hybrid : 只查本地 stickers/ 库，命中秒发；未命中本轮只发文本。
  #            冷词离峰跑 `python run.py --warm 关键词...` 建库（默认）
  #   panel  : 未命中时在回复链路里走面板搜索（会短暂占用前台）
  emotion_mode: hybrid

# ── 会话记忆 ────────────────────────────────────────────
memory:
  enabled: true
  dir: memory          # 相对项目根目录；每个会话一个 md 文件
  # 每个会话在上下文里保留的最近消息条数
  max_history: 8
  # 达到该条数后自动把旧消息摘要进记忆文件
  summarize_after: 24

# ── Prompt 路由 ─────────────────────────────────────────
# 键 = 微信昵称或群名，值 = 该会话专属 system prompt。
# 命中不了的会话走 default。
prompts:
  default: |
    你是聊天助手。回答简洁、口语化，中文优先，不超过必要长度。
    如需配表情，在回复末尾追加一个关键词标签，例如 [开心] [加油] [狗头]，
    程序会在微信表情面板里按该词搜索并发送。不需要表情时不加标签。

routes:
  # 示例：
  # 工作群: |
  #   你是项目组内助手，回答偏工程，给出可直接执行的命令。

# ── 监听范围 ────────────────────────────────────────────
# 留空 listen = 回复所有会话；否则只回复列出的昵称/群名。
# 测试期建议只放开文件传输助手，避免打扰真实好友。
listen: ["文件传输助手"]
